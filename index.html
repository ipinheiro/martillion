<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <title>Martillion</title>
  <link rel="icon" id="favicon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <noscript><p class="noscript">Martillion needs JavaScript. Enable it and reload.</p></noscript>
  <main id="app">
    <section id="screen-title" class="screen">
      <p class="kicker area-kicker"><span class="sigil"></span>The unlimited daily trivia game</p>
      <h1 class="area-title">Martillion</h1>
      <p class="tagline area-tagline">Rare answers of the world, unite!</p>
      <div class="hero-row area-hero"><div id="title-hero" class="hero"></div><div id="title-star" class="star"></div></div>
      <dl class="stats area-stats">
        <div><dt>Best uprising</dt><dd id="best-score">0</dd></div>
        <div><dt>Five-year plans</dt><dd id="plans-completed">0</dd></div>
      </dl>
      <div id="plan-progress" class="plan-progress area-plan" role="progressbar" aria-label="Progress toward the next five-year plan" aria-valuemin="0" aria-valuemax="2000" aria-valuenow="0"><div id="plan-bar" class="plan-bar"></div></div>
      <p id="plan-label" class="plan-label area-plan-label"></p>
      <button type="button" id="start-button" class="primary area-action" disabled>Start the uprising</button>
    </section>

    <section id="screen-round" class="screen" hidden>
      <header class="round-header">
        <span id="round-topic"></span>
        <span id="round-count"></span>
      </header>
      <div id="timer" class="timer" role="progressbar" aria-label="Time remaining" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><div id="timer-bar"></div></div>
      <h2 id="round-prompt" class="prompt"></h2>
      <form id="answer-form">
        <input id="answer-input" type="text" maxlength="120" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer, comrade" aria-label="Your answer">
        <button type="submit" class="primary">Submit</button>
      </form>
      <p id="round-feedback" class="round-feedback" aria-live="polite"></p>
      <p class="hint"><span class="sigil"></span>30 seconds per question. Enter submits.</p>
    </section>

    <section id="screen-reveal" class="screen" hidden>
      <header class="round-header area-kicker">
        <span id="reveal-topic"></span>
        <span id="reveal-count"></span>
      </header>
      <div class="reaction-row area-hero"><div id="reveal-sprite" class="reaction"></div><div id="reveal-star" class="star" hidden></div></div>
      <div class="tier-row area-title"><h2 id="reveal-tier"></h2><p id="reveal-points" class="slab"></p></div>
      <p id="reveal-detail" class="detail rule-top area-detail"></p>
      <button type="button" id="next-button" class="primary area-action">Onward</button>
    </section>

    <section id="screen-results" class="screen" hidden>
      <p class="kicker area-kicker"><span class="sigil"></span>The uprising is over</p>
      <div class="tier-row area-title"><h2 id="results-score"></h2><p id="results-stage" class="slab"></p></div>
      <p id="results-flavour" class="detail area-detail"></p>
      <ol id="results-rounds" class="rounds area-list"></ol>
      <p id="results-records" class="detail area-records"></p>
      <div id="results-progress" class="plan-progress area-plan" role="progressbar" aria-label="Progress toward the next five-year plan" aria-valuemin="0" aria-valuemax="2000" aria-valuenow="0"><div id="results-bar" class="plan-bar"></div></div>
      <p id="results-plan" class="plan-label area-plan-label"></p>
      <div class="results-actions area-action">
        <button type="button" id="share-button" class="primary">Share the struggle</button>
        <button type="button" id="again-button">Rise again</button>
      </div>
    </section>

    <section id="screen-error" class="screen" hidden>
      <h2>The struggle hit a snag</h2>
      <p id="error-detail" class="detail"></p>
      <button type="button" id="retry-button" class="primary">Try again</button>
    </section>
  </main>
  <script type="module" src="js/bootstrap.js"></script>
</body>
</html>
